<!DOCTYPE html>

<head>

  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */

      font-size: 100px;
      color: white;
      text-align: center;
      width: 900px;
      height: 600px;
      background-color: red;
      margin-bottom: 0;
      position: relative;
    }
    .flag >div{
      background-color: purple;
      position: absolute;
      width: 900px;
      height: 250 px;
      position: absolute;
      top: 150px;
    }
    .flag>div div>p{
      background-color: white;
      border-radius: 100px;
      width: 200px;
      height: 200px;
      color: black;
      font-size: 70px;
      margin-left: 350px;
    }
    
    
  </style>
</head>
